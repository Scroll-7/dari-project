name = "dari-push"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Every 5 minutes (free plan minimum). Paid plans allow */1.
[triggers]
crons = ["*/5 * * * *"]

[vars]
PROJECT_ID = "dari-app-70704"

# SERVICE_ACCOUNT_JSON is set as a SECRET (not in this file):
#   wrangler secret put SERVICE_ACCOUNT_JSON
# or in the dashboard: Workers & Pages -> dari-push -> Settings -> Variables and Secrets
